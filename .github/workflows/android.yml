
name: Build GK Mock Test APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Android project ZIP not found!"
            exit 1
          fi
          mkdir -p build-src
          unzip -q "$ZIP_FILE" -d build-src
          test -f build-src/GK-Mock-Test-Android/settings.gradle

      - name: Build APK
        run: gradle --no-daemon -p build-src/GK-Mock-Test-Android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GK-Mock-Test-debug-APK
          path: build-src/GK-Mock-Test-Android/app/build/outputs/apk/debug/app-debug.apk
          
